# .github/workflows/ci.yml
#
# PERSON C — WEEK 1 DELIVERABLE
# ==============================
# This file tells GitHub to automatically run our tests every time anyone
# pushes code or opens a Pull Request.
#
# How it works:
#   1. GitHub spins up a fresh Ubuntu machine in the cloud
#   2. It installs Python and our dependencies
#   3. It runs pytest on our test file
#   4. If all tests pass → green checkmark ✅
#      If any test fails → red X ❌ and GitHub emails the person who pushed
#
# You can see the results under the "Actions" tab on GitHub.
#
# WEEK 1 SCOPE: We only run test_week1.py for now.
# Once more real tests are written (Week 2+), change the last line to:
#   run: pytest tests/ -v --tb=short

name: CI

# Trigger this workflow on every push and every pull request
on:
  push:
    branches: ["**"]   # "**" means every branch, not just main
  pull_request:
    branches: ["**"]

jobs:
  test:
    # The type of machine to run on (GitHub provides this for free)
    runs-on: ubuntu-latest

    # Test on multiple Python versions to catch version-specific bugs
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # Step 1: Download the repo code onto the GitHub machine
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Install the Python version we want to test
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3: Install our package and its dependencies
      # The [dev] part installs pytest and other dev tools (defined in pyproject.toml)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Step 4: Run the Week 1 tests
      # -v          = verbose output (shows each test name)
      # --tb=short  = short traceback on failure (easier to read)
      - name: Run Week 1 tests
        run: pytest tests/test_week1.py -v --tb=short
